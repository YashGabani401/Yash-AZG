<!DOCTYPE html>
<html lang="en">

<body>
    <header>
        <!-- ===== navigationn bar ===== -->
        <section class="navbar">
            <nav class="nav-links">
                <ul>
                    <li class="display logo-item"><a href="home.html">Our Blooms®</a></li>
                    <ul class="txt-upper caption-1">
                        <li class="link-item"><a href="gallery.html">gallery</a></li>
                        <li class="link-item"><a href="about.html">about</a></li>
                        <li class="link-item active"><a href="home.html">contact</a></li>

    <main>

        <div class="footer-overlay">
