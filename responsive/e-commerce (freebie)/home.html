<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce (Freebie)</title>
    <link rel="stylesheet" href="./assets/css/common.css">
</head>
<body>
    <header>
        <!-- ===== top signup bar ===== -->
        <section class="offer-bar">
            <div>
                <p class="signup">Sign up and get 20% off to your first order. <span>Sign Up Now</span></p>
            </div>
            <div>
                <img src="./assets/plugins/icons/close.png" alt="close-icon">
            </div>
        </section>

        <!-- ===== navigation bar ===== -->
        <section class="nav-bar">
            <a href="" class="logo">shop.co</a>
            <nav class="nav-links">
                <ul>
                    <li><a href="">shop<span><img src="./assets/plugins/icons/arrow-down.png"></span></a></li>
                    <li><a href="">on sale</a></li>
                    <li><a href="">new arrivals</a></li>
                    <li><a href="">brands</a></li>
                </ul>
            </nav>

            <!-- ===== search box ===== -->
            <div class="search-bar">
                <img src="./assets/plugins/icons/search.png" alt="search-icon">
                <p class="f-search-text">Search for products...</p>
            </div>
            
            <div>
                <img src="./assets/plugins/icons/cart.png" alt="shop-icon">
                <img src="./assets/plugins/icons/account.png" alt="useraccount-icon">
            </div>
        </section>
    </header>
</body>
</html>
