<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
        /* ===== Custom Styles ===== */
        * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
        }

        p {
            font-size: 20px;
            font-weight: 600;
        }

        /* ===== classes ===== */   
        .rainbow-wrapper {
            height: 50vh;
            width: 98%;
            border: 4px solid black;
            display: flex;
            justify-content: center;
            margin: 10px auto;
            padding: 10px;
            border-radius: 25px;
            position: relative;
        }

        /* ===== rainbow progress bar ===== */
        .rainbow-text {
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);    
            background-clip: text;
            color: transparent;
        }

        .rainbow-bar {
            position: absolute;
            width: 72%;
            height: 12%;
            border: 2px solid black;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 21px;
        }

        .rainbow-wrapper p:first-of-type {
            position: absolute;
            top: 35%;
        }

        .rainbow-wrapper p:last-child {
            position: absolute;
            top: 60%;
        }
    </style>
</head>
<body>
    <!-- ===== rainbow progress bar ===== -->
    <section class="rainbow-wrapper">
        <h1 class="rainbow-text">Rainbow Progress Bar</h1>
        <p>0%</p>
        <div class="rainbow-bar"></div>
        <p>Loading...</p>
    </section>
</body>
</html>
