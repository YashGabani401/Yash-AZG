<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
        /* ===== Custom Styles ===== */
        * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
        }

        p {
            font-size: 20px;
            font-weight: 600;
        }

        /* ===== classes ===== */
        /* ===== maintains page layout ===== */
        .container {
            height: 50vh;
            width: 98%;
            border: 4px solid black;
            display: flex;
            justify-content: center;
            margin: 10px auto;
            padding: 10px;
            border-radius: 25px;
            position: relative;
        }

                                                /* ===== rainbow progress bar ===== */
        /* ====== horizontal rainbow bar ===== */
        .rainbow-bar {
            position: absolute;
            width: 100%;
            max-width: 72%;
            height: 12%;
            border: 2px solid black;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 21px;
        }

        /* ===== 0% to 100% width progression ===== */
        .rainbow-progress {
            height: 100%;
            width: 100%;
            position: absolute;
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            animation: rainbow-progress-bar 3s linear 0s infinite normal;
            border-radius: 21px;
        }

        /* ===== text elements ===== */
        .rainbow-text {
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);    
            background-clip: text;
            color: transparent;
        }

        .rainbow-wrapper p:first-of-type {
            position: absolute;
            top: 35%;
        }

        .rainbow-wrapper p:last-child {
            position: absolute;
            top: 60%;
        }

        /* ===== animations ===== */
        @keyframes rainbow-progress-bar {
            0% {
                width: 0%;
            } 100% {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- ===== rainbow progress bar ===== -->
    <section class="rainbow-wrapper">
        <section class="container">
            <h1 class="rainbow-text">Rainbow Progress Bar</h1>

            <p>0%</p>
            <!-- ===== horizontal rainbow bar ===== -->
            <div class="rainbow-bar">
                <!-- ===== rainbow progression ===== -->
                <div class="rainbow-progress"></div>
            </div>
            <p>Loading...</p>
        </section>
    </section>
</body>
</html>
