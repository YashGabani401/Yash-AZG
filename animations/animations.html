<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
        /* ===== Custom Styles ===== */
        * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
        }

        body {
            text-align: center;
        }

        p {
            font-size: 20px;
            font-weight: 600;
        }

        h1 {
            margin: 10px;
        }

        h2 {
            margin: 5px;
        }
        
                                                /* ===== classes ===== */
        /* ===== maintains page layout ===== */
        .container {
            height: 61vh;
            width: 98%;
            border: 4px solid black;
            display: flex;
            justify-content: center;
            margin: auto;
            margin-bottom: 25px;
            padding: 10px;
            border-radius: 25px;
            position: relative;
        }

                                                /* ===== rainbow progress bar ===== */
        .rainbow-bar {
            position: absolute;
            width: 100%;
            max-width: 72%;
            height: 25%;
            border: 2px solid black;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 21px;
        }

        .rainbow-wrapper .container {
            height: 25vh;
        }

        /* ===== 0% to 100% width progression ===== */
        .rainbow-progress {
            height: 100%;
            width: 100%;
            position: absolute;
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            animation: rainbow-progress-bar 3s linear 0s none normal;
            border-radius: 21px;
        }

        /* ===== text elements ===== */
        .rainbow-text {
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);    
            background-clip: text;  
            color: transparent;
        }

        .rainbow-wrapper p:last-child {
            position: absolute;
            top: 74%;
        }

        /* ===== animations ===== */
        @keyframes rainbow-progress-bar {
            0% {
                width: 0%;
            } 100% {
                width: 100%;
            }
        }

                                                /* ===== flip card (3D transform) ===== */
        .flip-wrapper .card {
            width: 100%;
            max-width: 21%;
            height: 83%;
            position: absolute;
            border: 2px solid black;
            top: 54%;
            transform: translateY(-50%) rotateY(0deg);
            animation: flip-card 10s linear infinite normal;
            transform-style: preserve-3d;
        }

        .flip-wrapper .front,
        .flip-wrapper .back {
            backface-visibility: hidden;
            position: absolute;
            top: 45%;
            left: 45%;
        }

        .flip-wrapper .back {
            transform: rotateY(180deg);
        }

        /* ===== animations ===== */
        @keyframes flip-card {
            0% {
                transform: translateY(-50%) rotateY(0deg);
            } 10% {
                transform: translateY(-50%) rotateY(180deg);
            }
            60% {
                transform: translateY(-50%) rotateY(180deg);
            } 70% {
                transform: translateY(-50%) rotateY(360deg);
            }
            100% {
                transform: translateY(-50%) rotateY(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>6 Types Of Different Animations</h1>
    
    <!-- ===== rainbow progress bar ===== -->
    <section class="rainbow-wrapper">
        <section class="container">
            <h2 class="rainbow-text">1. Rainbow Progress Bar</h2>

            <!-- ===== horizontal rainbow bar ===== -->
            <div class="rainbow-bar">

                <!-- ===== rainbow progression ===== -->
                <div class="rainbow-progress"></div>
            </div>
            <p>Loading...</p>
        </section>
    </section>

    <!-- ===== flip card (3D Transform) ===== -->   
    <section class="flip-wrapper">
        <section class="container">
            <h2>2. Flip Card (3D Transform)</h2>

            <div class="card">
                <!-- ===== front-card ===== -->
                <div class="front">
                    <h3>Front</h3>
                </div>

                <!-- ===== back-card ===== -->
                <div class="back">
                    <h3>Back</h3>
                </div>
            </div>
        </section>
    </section>
</body>
</html>
