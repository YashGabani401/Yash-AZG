<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Singtel Business</title>

   <style>
      /* ===== font-family Lato ===== */
      @font-face {
         font-family: 'Lato';
         src: url('./assets/plugins/fonts/Lato/Lato-Black.eot');
         src: url('./assets/plugins/fonts/Lato/Lato-Black.eot?#iefix') format('embedded-opentype'),
            url('./assets/plugins/fonts/Lato/Lato-Black.woff2') format('woff2'),
            url('./assets/plugins/fonts/Lato/Lato-Black.woff') format('woff'),
            url('./assets/plugins/fonts/Lato/Lato-Black.ttf') format('truetype'),
            url('./assets/plugins/fonts/Lato/Lato-Black.svg#Lato-Black') format('svg');
         font-weight: 900;
         font-style: normal;
      }

      @font-face {
         font-family: 'Lato';
         src: url('./assets/plugins/fonts/Lato/Lato-Bold.eot');
         src: url('./assets/plugins/fonts/Lato/Lato-Bold.eot?#iefix') format('embedded-opentype'),
            url('./assets/plugins/fonts/Lato/Lato-Bold.woff2') format('woff2'),
            url('./assets/plugins/fonts/Lato/Lato-Bold.woff') format('woff'),
            url('./assets/plugins/fonts/Lato/Lato-Bold.ttf') format('truetype'),
            url('./assets/plugins/fonts/Lato/Lato-Bold.svg#Lato-Bold') format('svg');
         font-weight: 700;
         font-style: normal;
      }

      @font-face {
         font-family: 'Lato';
         src: url('./assets/plugins/fonts/Lato/Lato-Regular.eot');
         src: url('./assets/plugins/fonts/Lato/Lato-Regular.eot?#iefix') format('embedded-opentype'),
            url('./assets/plugins/fonts/Lato/Lato-Regular.woff2') format('woff2'),
            url('./assets/plugins/fonts/Lato/Lato-Regular.woff') format('woff'),
            url('./assets/plugins/fonts/Lato/Lato-Regular.ttf') format('truetype'),
            url('./assets/plugins/fonts/Lato/Lato-Regular.svg#Lato-Regular') format('svg');
         font-weight: 400;
         font-style: normal;
      }

      /* ===== Custom Styles ===== */
      * {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }

      body {
         font-family: 'Lato', sans-serif;
         font-size: 18px;
         font-weight: 400;
         color: #ffffff;
      }

      h1 {
         font-size: 48px;
      }

      a {
         color: #70707A;
         text-decoration: none;
      }

      h2 {
         font-size: 40px;
      }

      h3 {
         font-size: 24px;
         font-weight: 700;
      }

      h1,
      h2 {
         font-weight: 900;
      }

      ul {
         list-style-type: none;
      }

      li {
         float: left;
         margin-left: 16px;
      }

      /* ===== classes ===== */
      .para-lng {
         color: #222222;
      }

      .right-nav {
         font-size: 14px;
      }

      button {
         font-weight: 700;
      }

      .container {
         max-width: 1140px;
         width: 100%;
         margin: 0 auto;
         padding: 0;
      }

      .clearfix::after {
         content: '';
         display: block;
         clear: both;
      }

      .float-left {
         float: left;
      }

      .float-right {
         float: right;
      }

      a.active {
         color: #000000;
      }

      /* ===== main ===== */

      /* ===== header-section ===== */
      header {
         background-color: #ffffff;
         z-index: 9998;
         position: sticky;
         top: 0;
         height: 109px;
      }

      .navbar {
         padding: 16px 24px;
         max-width: 1325px;
         margin: 0 auto;
      }

      header .section-1 img {
         height: 40px;
      }

      header .section-2 {
         max-width: 1000px;
         margin-left: 857px;
      }

      header .section-2 li:nth-of-type(6) {
         position: relative;
         margin-right: 8px;
      }

      header .section-2 li:last-child,
      header .section-2 li:nth-of-type(6) {
         position: relative;
         left: 298px;
         top: 28px;
      }

      header .section-2 li:not(:last-child, :nth-of-type(6)) {
         position: relative;
         top: 2px;
         margin-left: 21px;
         right: 25px;
      }

      header .section-1 li:not(:first-child) {
         position: relative;
         top: 53px;
         margin-left: 18px;
         right: 8px;
      }

      header .section-1 li:first-child {
         position: relative;
         top: 37px;
         right: 6px;
      }

      /* ===== hover effect ===== */
      header li:not(.section-2:last-child, :nth-of-type(6)) a:hover {
         color: #000000;
         transition: 0.3s all ease;
      }

      header .section-2 li:last-child img:hover,
      header .section-2 li:nth-of-type(6) img:hover {
         transform: scale(0.9);
         transition: 0.3s all ease;
      }

      /* ===== hero-section ====== */
      .hero-section {
         background-image: url(./assets/images/hero-banner.webp);
         height: 480px;
      }
   </style>
</head>

<body>
   <header class="navbar clearfix">
      <section class="section-1">
         <ul>
            <li><a href="">
                  <img src="./assets/images/singtel-logo.png" alt="singtel-logo">
               </a>
            </li>
            <li><a href="">Products & Services</a></li>
            <li><a href="">SMB</a></li>
            <li><a href="">Enterprise</a></li>
            <li><a href="">Insights</a></li>
            <li><a href="">Support</a></li>
            <li><a href="">Why Us</a></li>
         </ul>
      </section>

      <section class="section-2 right-nav">
         <ul class="float-right">
            <li><a href="">Personal</a></li>
            <li><a href="" class="active">Business</a></li>
            <li><a href="">Digital InfraCo</a></li>
            <li><a href="">Support</a></li>
            <li><a href="">About Us</a></li>
            <li>
               <a href="">
                  <img src="./assets/icons/search.svg" alt="search-icon">
               </a>
            </li>
            <li>
               <a href="">
                  <img src="./assets/icons/shop.svg" alt="shop-icon">
               </a>
            </li>
         </ul>
      </section>
   </header>

   <main>
      <section class="hero-section">
         <div class="container">
            <h1>Singtel Business</h1>

            <p>Power up solutions and insights that drive growth for your business.</p>
         </div>
      </section>
   </main>
</body>

</html>
